spring.application.name=sysadmin-monitor
server.port=8080

# perfil por defecto: dev (H2)
spring.profiles.active=dev

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# umbrales de alerta en porcentaje
monitor.alerts.cpu=85
monitor.alerts.ram=90

# retencion: borramos las metricas de mas de 7 dias cada noche a las 4
monitor.retention.days=7
monitor.retention.cron=0 0 4 * * *
